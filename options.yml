    name: resolution-based-zoom-reset-resolution
    text: '{{reset_resolution}}'
    tooltip: '{{reset_resolution_tooltip}}'
    display: Choice
    contents:
      type: string
      value: 'off'
      choices:
      - name: 'off'
        text: '{{reset_off}}'
