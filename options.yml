      - name: r1280x720
        text: 1280 x 720
      - name: r1360x768
        text: 1360 x 768
      - name: r1366x768
        text: 1366 x 768
      - name: r1440x900
        text: 1440 x 900
      - name: r1280x1024
        text: 1280 x 1024
      - name: r1600x900
        text: 1600 x 900
      - name: r1680x1050
        text: 1680 x 1050
      - name: r1600x1200
        text: 1600 x 1200
      - name: r1920x1080
        text: 1920 x 1080
      - name: r1920x1200
        text: 1920 x 1200
      - name: r2560x1440
        text: 2560 x 1440
      - name: r2560x1600
        text: 2560 x 1600
